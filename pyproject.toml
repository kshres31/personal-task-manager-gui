[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="daymark-task-manager"
version="0.1.0"
description="A small Tkinter and SQLite task manager"
requires-python=">=3.10"
[project.scripts]
daymark="daymark.app:main"
[tool.setuptools.packages.find]
where=["src"]

